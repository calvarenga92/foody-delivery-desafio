spring:
  datasource:
    url: jdbc:sqlite:target/rastreador-teste.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: chave-exclusiva-de-teste-com-mais-de-32-bytes-para-hmac
    expiracao-minutos: 60

logging:
  level:
    root: warn
